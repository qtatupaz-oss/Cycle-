<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycle+ — Interactive MVP Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="top">
    <div class="brand">
      <img class="brand-mark" src="Logo Prototype.png" alt="Cycle+ logo">
      <div>
        <div class="brand-name">Cycle+</div>
        <div class="brand-tag">Recycle. Reward. Repeat.</div>
      </div>
    </div>
  </header>

  <main class="devices">

    <div class="device-col">
      <div class="device-label">Smart Kiosk — Touchscreen</div>
      <div class="kiosk-frame">
        <div class="kiosk-screen" id="kioskScreen"></div>
      </div>
      <div class="kiosk-stand"></div>
      <div class="kiosk-base"></div>
    </div>

    <div class="sync-indicator" id="syncIndicator">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.7-1.6A4.5 4.5 0 0 1 18 18H6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>synced</span>
    </div>

    <div class="device-col">
      <div class="device-label">Companion Website — Desktop</div>
      <div class="monitor-frame">
        <div class="monitor-screen">
          <div class="site-shell">
            <nav class="phone-tabbar" id="phoneTabbar">
              <button data-tab="dashboard">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 12 5l8 7M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                Dashboard
              </button>
              <button data-tab="rewards">
                <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="9" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M4 9h16M12 9v11M12 9c-1.8 0-3-1-3-2.5S9.7 4 11 4c1.5 0 1 3 1 5Zm0 0c1.8 0 3-1 3-2.5S13.3 4 12 4c-1.5 0-1 3-1 5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                Rewards
              </button>
              <button data-tab="history">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                History
              </button>
              <button data-tab="locator">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5S16 3 12 3 5 4.6 5 9.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg>
                Locator
              </button>
            </nav>
            <div class="phone-content" id="phoneContent"></div>
          </div>
        </div>
      </div>
      <div class="monitor-neck"></div>
      <div class="monitor-base"></div>
    </div>

  </main>

  <footer class="foot">
    <button class="reset-link" id="resetBtn">Reset demo data</button>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
